- name: Prepare environment
  hosts: web1
  become: yes
  vars:
    domain_name: "{{ lookup('env','DOMAIN_NAME') }}"
    local_build_path: "{{ playbook_dir }}/../"
    local_temp_build_path: "/tmp/build.tar.gz"
    server_build_path: "/var/www/{{ domain_name }}"
    server_temp_archive: "{{ server_build_path }}/build.tar.gz"

  tasks:
    - name: Check if Docker is installed 
      block:
      - name: Try to run docker command
        command: docker --version
        register: docker_version
        ignore_errors: true
        failed_when: false

      - name: Show the variable
        debug:
          msg: "Docker installed: {{ docker_version.rc == 0 }}"

    - name: Install Docker
      shell: |
        if [ {{ docker_version.rc }} -ne 0 ]; then
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          usermod -aG docker {{ ansible_user }}
        fi

    - name: Check if Docker Compose is installed 
      block:
      - name: Try to run docker compose command
        command: docker compose version
        register: docker_compose_version
        ignore_errors: true
        failed_when: false

      - name: Show the variable
        debug:
          msg: "Docker Compose installed: {{ docker_compose_version.rc == 0 }}"

    - name: Install Docker Compose
      shell: |
        if [ {{ docker_compose_version.rc }} -ne 0 ]; then
          curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
        fi
