- name: Prepare environment
  hosts: web1
  become: yes
  vars:
    domain_name: "{{ lookup('env','DOMAIN_NAME') }}"
    server_build_path: "/var/www/{{ domain_name }}"
    secret_auth_token: "{{ lookup('env','SECRET_AUTH_TOKEN') }}"
    database_url: "{{ lookup('env','DATABASE_URL') }}"
    api_port: "{{lookup('env','API_PORT') }}"
    swagger_port: "{{lookup('env','SWAGGER_PORT') }}"
    short_sha: "{{ lookup('env','SHORT_SHA') }}" 
    network_name: "prod_burger_network"

  tasks:
    - name: Create .env file
      copy:
        content: |
          SECRET_AUTH_TOKEN={{ secret_auth_token }}
          DATABASE_URL={{ database_url }}
          API_PORT={{ api_port }}
        dest: "{{ server_build_path }}/.env"
        mode: '0600'

    - name: Create .envSwagger file
      copy:
        content: |
          SWAGGER_PORT={{ swagger_port }}
        dest: "{{ server_build_path }}/.envSwagger"
        mode: '0600'

    - name: Create Docker network
      shell: |
        docker network inspect {{ network_name }} >/dev/null 2>&1 || docker network create {{ network_name }}
    
    - name: Debug - show networks
      shell: docker network ls | grep {{ network_name }} || echo "Network not found"
      register: network_check

    - name: Debug - show network inspect
      shell: docker network inspect {{ network_name }}
      register: network_inspect
      ignore_errors: yes

    - name: Run Docker Compose
      shell: |
        cd {{ server_build_path }}
        SHORT_SHA={{ short_sha }} \
        API_PORT={{ api_port }} \
        SWAGGER_PORT={{ swagger_port }} \
        NETWORK_NAME={{ network_name }} \
        docker compose -p prod-burger up -d --build --remove-orphans

