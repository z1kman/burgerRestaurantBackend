version: "3.9"
services:
  myapp-router:
    image: alpine/socat
    container_name: router
    restart: always
    networks:
      - app_net
    environment:
      TARGET_CONTAINER: 1backendGreen
    command: TCP-LISTEN:5000,fork,reuseaddr TCP:${TARGET_CONTAINER}:5000
    ports:
      - "5000:5000"

networks:
  app_net:
    external: true