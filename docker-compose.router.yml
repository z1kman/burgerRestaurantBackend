version: "3.9"
services:
  myapp-router:
    image: alpine/socat
    container_name: router
    restart: always
    networks:
      - prod_burger_network
    command: TCP-LISTEN:${API_PORT},fork,reuseaddr TCP:backend-${TARGET_SHA}:${API_PORT}
    ports:
      - "${API_PORT}:${API_PORT}"

networks:
  prod_burger_network:
    external: true