services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        APP_PORT: ${API_PORT}
    container_name: backend-${SHORT_SHA}
    networks:
      - prod_burger_network
    expose:
      - "${API_PORT}"
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro 
    restart: unless-stopped 
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
  swagger:
    build:
      context: .
      dockerfile: Dockerfile.swagger
      args:
        APP_PORT: ${SWAGGER_PORT}
    container_name: swagger-${SHORT_SHA}
    networks:
      - prod_burger_network
    ports:
      - "${SWAGGER_PORT}:${SWAGGER_PORT}"
    env_file:
      - .envSwagger
    volumes:
      - /etc/localtime:/etc/localtime:ro 
    restart: unless-stopped 



networks:
  prod_burger_network:
    external: true