services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        APP_PORT: 5000
    container_name: 1backendBlue
    networks:
      - app_net
    expose:
      - "5000"
    env_file:
      - .env
    volumes:
      - /etc/localtime:/etc/localtime:ro 
    restart: unless-stopped 
    extra_hosts:
      - "host.docker.internal:host-gateway"
  
